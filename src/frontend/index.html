<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Chamados de Manutenção</title>
  <meta name="description" content="Acesso ao Painel Administrativo do Setor de Manutenção Predial e Infraestrutura.">
  
  <!-- Fontes Google (Outfit e Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Folha de Estilos Neutra do Frontend -->
  <link rel="stylesheet" href="css/public.css">
  
  <!-- Favicon SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">

  <style>
    /* Estilos específicos complementares para a tela de autenticação */
    .login-wrapper {
      min-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .login-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-xl);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-top: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .login-header p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .auth-error-box {
      display: none;
      background: var(--urgente-bg);
      border: 1.5px solid var(--urgente-border);
      color: var(--urgente-color);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    .form-group {
      margin-bottom: 1.35rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.45rem;
    }

    .form-input-login {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--bg-input);
      outline: none;
      transition: all 0.2s;
    }

    .form-input-login:focus {
      border-color: var(--border-focus);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    .btn-login-submit {
      width: 100%;
      padding: 0.95rem 1.25rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
      margin-top: 1.5rem;
    }

    .btn-login-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45);
    }

    .btn-login-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .spinner-login {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    .login-footer-links {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .login-footer-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .login-footer-links a:hover {
      text-decoration: underline;
      color: var(--primary-hover);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Cabeçalho de Identificação -->
      <header class="login-header">
        <div class="generic-brand-icon" style="margin: 0 auto 0.75rem auto;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="brand-badge">
          <span>Acesso Administrativo</span>
        </div>
        <h1>Painel da Manutenção</h1>
        <p>Informe suas credenciais para gerenciar a fila de chamados técnicos e ordens de serviço.</p>
      </header>

      <!-- Mensagem de Erro de Autenticação -->
      <div class="auth-error-box" id="authError" role="alert"></div>

      <!-- Formulário de Autenticação -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail Corporativo</label>
          <input 
            type="email" 
            id="loginEmail" 
            name="email"
            class="form-input-login" 
            placeholder="usuario@instituicao.edu.br" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha de Acesso</label>
          <input 
            type="password" 
            id="loginPassword" 
            name="password"
            class="form-input-login" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login-submit" id="btnLogin">
          <span class="spinner-login" id="btnLoginSpinner" style="display: none;"></span>
          <span id="btnLoginText">Acessar Painel de Manutenção</span>
        </button>
      </form>

      <!-- Navegação para outras visões da arquitetura MVC -->
      <footer class="login-footer-links">
        <div>
          <span>Acesso Geral: </span>
          <a href="solicitar/index.html">Abrir Chamado via QR Code</a>
        </div>
        <div>
          <span>Monitor Operacional: </span>
          <a href="tv/index.html">Painel de TV em Tempo Real</a>
        </div>
        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-light);">
          Instituição Cliente &bull; Setor de Manutenção Predial
        </div>
      </footer>

    </div>
  </div>

  <!-- Camada de Visão (MVC): Manipulação do DOM da tela de login -->
  <script type="module" src="js/views/loginView.js"></script>
</body>
</html>
